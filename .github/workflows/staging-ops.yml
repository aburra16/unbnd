# One-off staging operations, dispatched from the Actions tab or `gh workflow
# run`. A FIXED menu of the documented droplet tasks (docs/DEPLOY.md) — never
# arbitrary commands — over the same SSH deploy key staging.yml uses. Each
# profile worker resolves UNBND_IMAGE_TAG from /opt/unbnd/.env (persisted by
# the deploy), so a run always uses the deployed SHA.
name: Staging ops

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Which documented staging task to run"
        required: true
        type: choice
        options:
          - promote # one promoter cycle (promotions + demotions + reveals)
          - labels # one labels pass: genre, format and language labels on every record (Story 105; idempotent)
          - shelves # homepage trust-shelf recompute
          - recast # genre recast over the existing catalog (Story 75; idempotent)
          - headers # publish the seeder-owned list headers only (Story 97; idempotent)
          - years-check # dry run: list the catalog years the correction would change (Story 104; read-only)
          - years-fix # correct those catalog years at source, librarian-signed (Story 104; idempotent)
          - import-dry-run # Open Library dump import, dry run: download, verify, plan, report; publishes nothing (Story 109; detached)
          - import-apply # publish the dry run's plan for the given dump, paced and resumable (Story 109; detached)
          - import-report # print the dry run's report and the import's latest log (read-only)
          - librarian-profile # publish the librarian's kind-0 + kind-10002 (Story 98; idempotent)
          - set-brainstorm-endpoints # point BRAINSTORM_API_URL/TRUST_RELAYS in .env at Brainstorm production + recreate the api (Story 98)
          - set-public-origin # ensure PUBLIC_ORIGIN in .env + restart the api
          - retire-meilisearch # stop and remove the retired Meilisearch container (Story 112; its data volume stays)
          - install-cron # install the documented worker crontab (idempotent)
          - show-status # read-only: crontab, deployed tag, recent worker logs
      dump:
        description: "Open Library dump date (YYYY-MM-DD) for the import tasks"
        required: false
        type: string
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy target is configured
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          if [ -z "$DROPLET_HOST" ]; then
            echo "::error::DROPLET_HOST not set."
            exit 1
          fi

      - name: Run the task over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Passed as data, never pasted into the script (an input is untrusted text).
          DUMP: ${{ inputs.dump }}
        with:
          envs: DUMP
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd /opt/unbnd
            case "${{ inputs.task }}" in
              promote)
                docker compose -f docker-compose.prod.yml --profile promote run --rm promoter
                ;;
              labels)
                # Pull the deployed promoter image, then relabel the records whose
                # labels differ (ADR 0094). Librarian-signed, to the hub and local.
                # Same lock as the cron line, so a manual pass never overlaps a scheduled
                # one; a pass cut off by the job timeout resumes on the next run.
                docker compose -f docker-compose.prod.yml --profile promote pull promoter
                mkdir -p /opt/unbnd/ops-logs
                flock -n /opt/unbnd/ops-logs/labels.lock docker compose -f docker-compose.prod.yml --profile promote run --rm promoter node index.js labels || echo "labels: a pass is already running"
                ;;
              shelves)
                docker compose -f docker-compose.prod.yml --profile shelves run --rm shelves
                ;;
              recast)
                # Pull the deployed seeder image, then run the recast entrypoint
                # (bundled beside the seed; reads the LOCAL relay, librarian-signs
                # genre assertions, checkpoints on the seeder volume).
                docker compose -f docker-compose.prod.yml --profile seed pull seeder
                docker compose -f docker-compose.prod.yml --profile seed run --rm seeder node recast.js
                ;;
              headers)
                # Pull the deployed seeder image, then publish only the headers it
                # owns (librarian-signed, to dcosl; the down-sync cron brings them
                # to the local relay). The same templates a full seed publishes.
                docker compose -f docker-compose.prod.yml --profile seed pull seeder
                docker compose -f docker-compose.prod.yml --profile seed run --rm seeder node headers.js
                ;;
              import-dry-run|import-apply)
                # Story 109 / ADR 0097. Runs for hours, so it is started detached
                # under a fixed container name; import-report shows how it goes.
                dump="${DUMP:-}"
                if ! printf '%s' "$dump" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
                  echo "::error::dump must be a date such as 2026-09-30"; exit 1
                fi
                if docker ps --format '{{.Names}}' | grep -qx unbnd-import; then
                  echo "an import is already running"; exit 1
                fi
                docker rm unbnd-import >/dev/null 2>&1 || true
                apply=""
                if [ "${{ inputs.task }}" = "import-apply" ]; then apply="--apply"; fi
                docker compose -f docker-compose.prod.yml --profile seed pull seeder
                docker compose -f docker-compose.prod.yml --profile seed run -d --name unbnd-import seeder node import.js --dump "$dump" $apply
                echo "started: node import.js --dump $dump $apply"
                ;;
              import-report)
                dump="${DUMP:-}"
                if ! printf '%s' "$dump" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
                  echo "::error::dump must be a date such as 2026-09-30"; exit 1
                fi
                docker compose -f docker-compose.prod.yml --profile seed run --rm --entrypoint sh seeder -c "if [ -f /data/import-report-${dump}.json ]; then head -c 20000 /data/import-report-${dump}.json; else echo 'no report for ${dump} yet'; fi"
                echo "--- import log (last 40 lines) ---"
                docker logs --tail 40 unbnd-import 2>&1 || echo "(no import container)"
                ;;
              years-check)
                # Read the catalog from dcosl and Open Library; print every year
                # the correction would change, then the kept/unresolved ones.
                # Publishes nothing (ADR 0093 §4).
                docker compose -f docker-compose.prod.yml --profile seed pull seeder
                docker compose -f docker-compose.prod.yml --profile seed run --rm seeder node years.js
                ;;
              years-fix)
                # The same plan, then replace each corrected record at its own
                # address on dcosl, librarian-signed (only the year changes). The
                # down-sync cron brings them local; run `index` after.
                # Holds the labels pass's lock (waiting for a running pass), so
                # neither rebuilds a record the other is about to replace.
                docker compose -f docker-compose.prod.yml --profile seed pull seeder
                mkdir -p /opt/unbnd/ops-logs
                flock /opt/unbnd/ops-logs/labels.lock docker compose -f docker-compose.prod.yml --profile seed run --rm seeder node years.js --apply
                ;;
              librarian-profile)
                # The librarian's public profile + relay list, from reviewed code
                # (ADR 0088). Never sent to dcosl.
                docker compose -f docker-compose.prod.yml --profile librarian pull librarian
                docker compose -f docker-compose.prod.yml --profile librarian run --rm librarian profile
                ;;
              set-brainstorm-endpoints)
                # Rewrite only keys that are present; an absent key already means
                # the shared default (ADR 0088 §3). Prints the result, no secrets.
                for kv in "BRAINSTORM_API_URL=https://api.brainstorm.world" "TRUST_RELAYS=wss://scores.brainstorm.world,wss://nip85.nosfabrica.com"; do
                  k="${kv%%=*}"
                  if grep -q "^${k}=" .env; then sed -i "s|^${k}=.*|${kv}|" .env; echo "set ${kv}"; else echo "${k} absent: shared default applies"; fi
                done
                grep -E '^(BRAINSTORM_API_URL|TRUST_RELAYS)=' .env || true
                docker compose -f docker-compose.prod.yml up -d --force-recreate api
                ;;
              install-cron)
                # The documented schedule (docs/DEPLOY.md): relay down-sync +
                # promoter every 5 min, shelves hourly. Idempotent replace of
                # the deploy user's crontab; logs land in a deploy-writable dir.
                mkdir -p /opt/unbnd/ops-logs
                {
                  echo "*/5 * * * * docker exec unbnd-tapestry strfry sync wss://dcosl.brainstorm.world/ --dir down --filter '{\"kinds\":[39998,39999]}' >> /opt/unbnd/ops-logs/sync.log 2>&1"
                  echo "*/5 * * * * cd /opt/unbnd && docker compose -f docker-compose.prod.yml --profile promote run --rm promoter >> /opt/unbnd/ops-logs/promote.log 2>&1"
                  echo "2-59/5 * * * * cd /opt/unbnd && flock -n /opt/unbnd/ops-logs/labels.lock docker compose -f docker-compose.prod.yml --profile promote run --rm promoter node index.js labels >> /opt/unbnd/ops-logs/labels.log 2>&1"
                  echo "0 * * * * cd /opt/unbnd && docker compose -f docker-compose.prod.yml --profile shelves run --rm shelves >> /opt/unbnd/ops-logs/shelves.log 2>&1"
                } | crontab -
                echo "crontab installed:"
                crontab -l
                ;;
              retire-meilisearch)
                # ADR 0100: compose no longer defines the search service, and
                # `up -d` leaves a container whose service is gone, so remove
                # it here. The data volume is the operator's to remove.
                docker rm -f unbnd-search 2>/dev/null && echo "removed unbnd-search" || echo "no unbnd-search container"
                echo "search volumes left for the operator to remove (DEPLOY.md):"
                docker volume ls --format '{{.Name}}' | grep -i search || echo "  none"
                ;;
              set-public-origin)
                if grep -q '^PUBLIC_ORIGIN=' .env; then
                  sed -i 's|^PUBLIC_ORIGIN=.*|PUBLIC_ORIGIN=https://staging.unbnd.ink|' .env
                else
                  printf '\nPUBLIC_ORIGIN=https://staging.unbnd.ink\n' >> .env
                fi
                docker compose -f docker-compose.prod.yml up -d api
                echo "PUBLIC_ORIGIN ensured; api recreated."
                ;;
              show-status)
                echo "--- deployed tag ---"
                grep '^UNBND_IMAGE_TAG=' .env || echo "(none)"
                echo "--- env keys present (names only) ---"
                cut -d= -f1 .env | sort
                echo "--- crontab ---"
                crontab -l || echo "(no crontab)"
                echo "--- containers ---"
                docker compose -f docker-compose.prod.yml ps
                echo "--- memory ---"
                free -m
                docker stats --no-stream --format "{{.Name}} {{.MemUsage}}"
                echo "--- disk ---"
                df -h / | tail -1
                ;;
            esac
