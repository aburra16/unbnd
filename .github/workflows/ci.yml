name: CI

on:
  push:
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unbnd
          POSTGRES_PASSWORD: unbnd
          POSTGRES_DB: unbnd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Lets the @unbnd/api integration suite run against the service above
      # instead of skipping.
      DATABASE_URL: postgres://unbnd:unbnd@localhost:5432/unbnd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version is read from the root package.json "packageManager" field
        # (pnpm@9.0.0). Specifying it here too triggers ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build web
        run: pnpm --filter @unbnd/web build

  # Visual-regression gate (ADR 0039). Runs inside the pinned Playwright image
  # so CI's render environment is byte-for-byte the canonical capture
  # environment, making the committed Linux baselines compare zero-diff. No
  # Postgres / data layer: the harness route-mocks /api + /auth, so it needs no
  # backend. Sibling to `test`, not wired into `pnpm -r test`.
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @unbnd/web build

      - name: Visual regression
        run: pnpm --filter @unbnd/web test:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      # Uploaded so first-run-generated baselines can be retrieved during the
      # CI bootstrap (the canonical Linux PNGs are produced here).
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: apps/web/e2e/visual/**/*-snapshots/**
          retention-days: 7

  caddyfile:
    name: Validate Caddyfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Caddy
        run: |
          ver=2.8.4
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v${ver}/caddy_${ver}_linux_amd64.tar.gz" \
            | tar -xz caddy
          sudo mv caddy /usr/local/bin/caddy
          caddy version

      # Guards the #47 regression: an empty/missing APEX_ADDRESS default in the
      # prod compose file would yield an empty Caddy site label and crash-loop
      # caddy (taking down all ingress). Fails CI before such a config deploys.
      - name: Validate Caddyfile under compose-derived APEX_ADDRESS
        run: bash deploy/validate-caddy.sh
