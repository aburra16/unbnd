name: Staging (build + deploy)

# One ordered pipeline so the droplet can never pull stale images:
#   merge to main -> CI -> this workflow: build+push api/web (tagged with the
#   commit SHA) THEN deploy that exact SHA to the droplet.
# Build and deploy share DEPLOY_SHA, so code (git checkout) and images (tag)
# always match. ADR 0007 (amended).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # The commit that triggered CI (workflow_run), or the dispatch ref.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build + push (${{ matrix.name }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: seeder
            dockerfile: apps/seeder/Dockerfile
          - name: promoter
            dockerfile: apps/promoter/Dockerfile
          - name: indexer
            dockerfile: apps/indexer/Dockerfile
    steps:
      - name: Checkout (pinned to the built SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/unbnd-${{ matrix.name }}:${{ env.DEPLOY_SHA }}
            ghcr.io/${{ github.repository_owner }}/unbnd-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check deploy target is configured
        id: cfg
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          if [ -z "$DROPLET_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DROPLET_HOST not set — staging not wired up yet, skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the built SHA over SSH
        if: steps.cfg.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/unbnd
            git fetch --all
            git reset --hard ${{ env.DEPLOY_SHA }}
            export UNBND_IMAGE_TAG=${{ env.DEPLOY_SHA }}
            # Pull the exact SHA-tagged images built above; data layer stays :latest.
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
