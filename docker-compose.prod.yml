# Staging production stack on one droplet (ADR 0007, amended).
# All app images are pulled from GHCR (built in CI) — the droplet never
# builds. Only caddy exposes ports; everything else talks over the internal
# network. Secrets come from /opt/unbnd/.env (untracked). Bring up with:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
services:
  caddy:
    container_name: unbnd-caddy
    image: ghcr.io/aburra16/unbnd-web:${UNBND_IMAGE_TAG:-latest}
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
      # Apex domain served ONLY for the librarian NIP-05 (all else 404s).
      # MUST be a non-empty hostname: Caddy's {$APEX_ADDRESS:default} only
      # applies its default when the var is *unset*, not when it's an empty
      # string, and an empty site label crashes Caddy. So default to a harmless
      # *.localhost host here (inert, internal cert) when the operator hasn't
      # set a real apex. Set APEX_ADDRESS=unbnd.ink in .env to activate.
      - APEX_ADDRESS=${APEX_ADDRESS:-apex.localhost}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  api:
    container_name: unbnd-api
    image: ghcr.io/aburra16/unbnd-api:${UNBND_IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - PORT=8787
      - DATABASE_URL=postgres://unbnd:${POSTGRES_PASSWORD}@db:5432/unbnd
      - STRFRY_URL=ws://tapestry/relay
      - NEO4J_BOLT_URL=bolt://tapestry:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - TAPESTRY_API_URL=http://tapestry:80
      - SEARCH_URL=http://search:7700
      - SEARCH_API_KEY=${SEARCH_API_KEY}
      - SEARCH_PROVIDER=meili
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - LIBRARIAN_PUBKEY=${LIBRARIAN_PUBKEY}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
      # Write up-sync (ADR 0011): dual-publish accepted community writes to dcosl.
      - DCOSL_RELAY_URL=${DCOSL_RELAY_URL:-wss://dcosl.brainstorm.world/}
      - PROPAGATE_WRITES=${PROPAGATE_WRITES:-true}
      # Custodial personalize follow gate (ADR 0026). Staging defaults to 1 so a
      # fresh account can exercise the flow; raise via a .env override for real
      # production (the code default is 10).
      - PERSONALIZE_MIN_FOLLOWS=${PERSONALIZE_MIN_FOLLOWS:-1}
      # Curator gate threshold (ADR 0031). Default 0.5; calibrated on staging.
      # The API enqueues promotions — it does NOT hold LIBRARIAN_NSEC.
      - CURATOR_THRESHOLD=${CURATOR_THRESHOLD:-0.5}
    depends_on:
      db:
        condition: service_healthy
      tapestry:
        condition: service_started
      search:
        condition: service_started
    restart: unless-stopped

  tapestry:
    container_name: unbnd-tapestry
    image: ghcr.io/aburra16/unbnd-tapestry-data-layer:latest
    environment:
      - OWNER_PUBKEY=${LIBRARIAN_PUBKEY}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - DOMAIN_NAME=${SITE_ADDRESS}
    volumes:
      - neo4j:/var/lib/neo4j/data
      - strfry:/var/lib/strfry
      - tapestry-data:/var/lib/brainstorm
    restart: unless-stopped

  db:
    container_name: unbnd-db
    image: postgres:16
    environment:
      - POSTGRES_USER=unbnd
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=unbnd
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unbnd -d unbnd"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Catalog seeder (ADR 0008). Never starts with the normal stack — only via
  #   docker compose --profile seed run --rm seeder
  # Publishes to dcosl; the local strfry syncs the records down.
  seeder:
    image: ghcr.io/aburra16/unbnd-seeder:${UNBND_IMAGE_TAG:-latest}
    profiles: ["seed"]
    environment:
      - DCOSL_RELAY_URL=${DCOSL_RELAY_URL:-wss://dcosl.brainstorm.world/}
      - LIBRARIAN_NSEC=${LIBRARIAN_NSEC}
      - PER_SUBJECT=${PER_SUBJECT:-300}
      - RATE_MS=${RATE_MS:-250}
      - CHECKPOINT_PATH=/data/seed-checkpoint
      # Bump for the blurb backfill (ADR 0051): CHECKPOINT_EPOCH=2 re-publishes
      # each record once in place; a second run re-publishes nothing.
      - CHECKPOINT_EPOCH=${CHECKPOINT_EPOCH:-1}
      # Raw OL description cache on the seeder-data volume so a re-run does not
      # re-hit Open Library (survives an epoch bump).
      - DESC_CACHE_PATH=/data/desc-cache
    volumes:
      - seeder-data:/data
    restart: "no"

  # Promotion worker (ADR 0031). Never starts with the normal stack — only via
  #   docker compose --profile promote run --rm promoter
  # (the operator cron fires it periodically). Claims pending `promotions` rows,
  # mints + librarian-signs the canonical catalog record, publishes to the local
  # relay + dcosl, marks the job done. This is the ONLY service that holds
  # LIBRARIAN_NSEC besides the seeder — off the internet-facing path.
  promoter:
    image: ghcr.io/aburra16/unbnd-promoter:${UNBND_IMAGE_TAG:-latest}
    profiles: ["promote"]
    environment:
      - DATABASE_URL=postgres://unbnd:${POSTGRES_PASSWORD}@db:5432/unbnd
      - STRFRY_URL=ws://tapestry/relay
      - DCOSL_RELAY_URL=${DCOSL_RELAY_URL:-wss://dcosl.brainstorm.world/}
      - LIBRARIAN_PUBKEY=${LIBRARIAN_PUBKEY}
      - LIBRARIAN_NSEC=${LIBRARIAN_NSEC}
    depends_on:
      db:
        condition: service_healthy
      tapestry:
        condition: service_started
    restart: "no"

  # Search indexer (ADR 0013). Never starts with the normal stack — only via
  #   docker compose --profile index run --rm indexer
  # Reads the local relay catalog and loads the search index. Provider-agnostic
  # (SEARCH_PROVIDER); re-runnable.
  indexer:
    image: ghcr.io/aburra16/unbnd-indexer:${UNBND_IMAGE_TAG:-latest}
    profiles: ["index"]
    environment:
      - STRFRY_URL=ws://tapestry/relay
      - LIBRARIAN_PUBKEY=${LIBRARIAN_PUBKEY}
      - SEARCH_URL=http://search:7700
      - SEARCH_API_KEY=${SEARCH_API_KEY}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-meili}
    restart: "no"

  # Homepage trust-shelf worker (ADR 0036). Never starts with the normal stack —
  # only via the cron (`docker compose --profile shelves run --rm shelves`).
  # LEAST-PRIVILEGE: holds NO LIBRARIAN_NSEC — it computes + caches, it signs
  # nothing. Reads the local relay catalog/ratings, resolves the house observer's
  # trust weights, and atomically replaces the homepage_shelves Postgres cache.
  shelves:
    image: ghcr.io/aburra16/unbnd-shelves:${UNBND_IMAGE_TAG:-latest}
    profiles: ["shelves"]
    environment:
      - DATABASE_URL=postgres://unbnd:${POSTGRES_PASSWORD}@db:5432/unbnd
      - STRFRY_URL=ws://tapestry/relay
      - LIBRARIAN_PUBKEY=${LIBRARIAN_PUBKEY}
      - HOUSE_OBSERVER_PUBKEY=${HOUSE_OBSERVER_PUBKEY:-}
      - TRUST_PROVIDER=${TRUST_PROVIDER:-brainstorm}
      - BRAINSTORM_API_URL=${BRAINSTORM_API_URL:-}
      - TRUST_RELAYS=${TRUST_RELAYS:-}
      - TRUST_FIXTURE=${TRUST_FIXTURE:-}
      # Shelf-definition knobs (ADR 0036 §4).
      - SHELF_TRENDING_WINDOW_DAYS=${SHELF_TRENDING_WINDOW_DAYS:-7}
      - SHELF_FAVORITES_MIN_RATINGS=${SHELF_FAVORITES_MIN_RATINGS:-3}
      - SHELF_GENRE_COUNT=${SHELF_GENRE_COUNT:-5}
      - SHELF_BOOKS_PER_ROW=${SHELF_BOOKS_PER_ROW:-10}
    depends_on:
      db:
        condition: service_healthy
      tapestry:
        condition: service_started
    restart: "no"

  search:
    container_name: unbnd-search
    image: getmeili/meilisearch:v1.10
    environment:
      - MEILI_MASTER_KEY=${SEARCH_API_KEY}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
    volumes:
      - search:/meili_data
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  neo4j:
  strfry:
  tapestry-data:
  postgres:
  search:
  seeder-data:
