# The image cache in front of imgproxy (Story 111 / ADR 0099 §4). Mounted as
# nginx's default site. Each resized image is fetched from imgproxy once and
# kept on the img-cache volume; Caddy routes /img/* here with the prefix removed.
proxy_cache_path /var/cache/img levels=1:2 keys_zone=img:32m max_size=5g inactive=90d use_temp_path=off;

server {
	listen 80;

	# Docker's DNS, re-asked every 30 s, so a recreated imgproxy is found again.
	resolver 127.0.0.11 valid=30s;
	set $imgproxy http://imgproxy:8080;

	# imgproxy's landing page has no business on Unbnd's origin.
	location = / {
		return 404;
	}

	location / {
		proxy_pass $imgproxy;
		proxy_cache img;
		# The raw request: imgproxy checks the signature against the path as sent,
		# so a decoded or slash-merged key would let one URL answer for another.
		proxy_cache_key $request_uri;
		# Only results are kept. A refused signature or a failing source is never
		# cached, so no request can make a good URL fail for others.
		proxy_cache_valid 200 30d;
		proxy_cache_valid 404 1m;
		# One request fetches a missing image; the others wait for it.
		proxy_cache_lock on;
		proxy_cache_lock_timeout 15s;
		# Serve the cached copy while it refreshes or when imgproxy fails.
		proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
		proxy_cache_background_update on;
		proxy_ignore_headers Set-Cookie;
		add_header X-Cache-Status $upstream_cache_status always;
	}
}
