services:
  tapestry:
    container_name: unbnd-tapestry
    image: unbnd/tapestry-data-layer:latest
    ports:
      - "8080:80"
      - "7777:7777"
      - "7474:7474"
      - "7687:7687"
    environment:
      - OWNER_PUBKEY=${OWNER_PUBKEY}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - DOMAIN_NAME=localhost
    volumes:
      - unbnd-neo4j:/var/lib/neo4j/data
      - unbnd-strfry:/var/lib/strfry
      - unbnd-tapestry-data:/var/lib/brainstorm
    restart: unless-stopped

  db:
    container_name: unbnd-db
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=unbnd
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=unbnd
    volumes:
      - unbnd-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  unbnd-neo4j:
  unbnd-strfry:
  unbnd-tapestry-data:
  unbnd-postgres:
